version: "1.0.0"
created_at: "2026-08-05"
description: "League Intelligence Layer — v1 strategic scoring weights and thresholds"

# Effective Ownership (EO) engine.
# EO% = selected_by% + captained% + triple_captained%. This matches the
# community convention (teams picked + captained + TC'd, / total teams).
effective_ownership:
  triple_captain_multiplier: 1.0   # TC chip counts once, like captaincy
  exposure_tiers:
    low: 8.0        # <= this EO% → "differential"
    moderate: 15.0  # <= this EO% → "moderate ownership"
    high: 25.0      # above → "high ownership"
  rival_cutoff: 1   # a player owned by <= N rivals counts as a league differential

# Differential Scoring — config-driven weights.
# Weights sum to 1.0. Negative weights punish the signal (high ownership
# reduces the differential appeal). All features are min-max normalised to
# [0,1] across the candidate pool before the weighted sum.
differential:
  weights:
    projected_points: 0.30
    expected_minutes: 0.15
    fixture_attractiveness: 0.10
    inverse_ownership: 0.30      # 1 - ownership_pct → low ownership scores high
    transfer_velocity: 0.10
    price_movement: 0.05
    rotation_risk: 0.00          # placeholder for future rotation model
  ownership_power: 1.0           # exponent on ownership when normalising
  threshold: 0.60                # score >= threshold → "differential pick"
  top_n: 10                      # default number of differentials to surface

# Mini-League Analyzer thresholds.
mini_league:
  common_ownership_min: 0.60     # fraction of league squads owning a player
  squad_similarity_threshold: 0.5   # Jaccard similarity flagged as "similar"
  threat_overlap_threshold: 0.55    # rival overlap that counts as a "threat"
  top_differentials: 5

# Rival Tracker thresholds.
rivals:
  top_rivals_n: 5
  weak_position_gap: 1.5         # xPts gap (user weaker) that flags a position
  transfer_divergence_window: 3  # GWs for transfer-velocity divergence

# Game Theory Engine — architecture-only in v1. No implementation.
game_theory:
  enabled: false
  objective: "expected_league_position_gain"
  notes: "Interfaces only in v1. See docs/league_intelligence.md for the design."
