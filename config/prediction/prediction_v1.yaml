version: "1.0.0"
created_at: "2026-07-27"
description: "Projection engine parameters"

# Projection windows (gameweeks)
windows: [1, 3, 6, 10, 38]

# Position-dependent scoring values (FPL rules)
position_values:
  GKP:
    goal: 10
    assist: 3
    clean_sheet: 1
    save_per_2: 1        # 1 point per 2 saves
    penalty_save: 3
    yellow_card: -1
    red_card: -3
    own_goal: -2
    penalty_miss: -2
  DEF:
    goal: 6
    assist: 3
    clean_sheet: 4
    yellow_card: -1
    red_card: -3
    own_goal: -2
    penalty_miss: -2
  MID:
    goal: 5
    assist: 3
    clean_sheet: 1
    yellow_card: -1
    red_card: -3
    own_goal: -2
    penalty_miss: -2
  FWD:
    goal: 4
    assist: 3
    clean_sheet: 0
    yellow_card: -1
    red_card: -3
    own_goal: -2
    penalty_miss: -2

# Confidence interval widths (standard deviation multipliers)
confidence_intervals:
  ci_80_z: 1.28    # 80% interval: ±1.28σ
  ci_95_z: 1.96    # 95% interval: ±1.96σ

# Variance sources (relative weights for interval computation)
variance_sources:
  minutes: 0.30      # minutes uncertainty contributes 30% of variance
  fixture: 0.15      # fixture uncertainty
  regression: 0.20   # regression uncertainty
  base: 0.25         # inherent randomness
  historical: 0.10   # historical prediction accuracy

# Confidence thresholds
confidence_thresholds:
  very_high: 80
  high: 65
  medium: 50
  low: 35

# Transfer decision thresholds
transfer:
  min_gain_for_hit: 5.0
  hold_threshold: 2.0
  hit_cost_per_transfer: 4
